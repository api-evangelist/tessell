            $ref: '#/components/schemas/CreateUpdateRefreshSchedulePayload'
          sourceType:
            $ref: '#/components/schemas/CloneSourceType'
            description: Source type for clone operation. Defaults to SNAPSHOT if not provided.
          backupId:
            type: string
            format: uuid
            description: Native backup ID. Required when sourceType is NATIVE_BACKUP and pitr is not provided. If pitr is provided with sourceType NATIVE_BACKUP, system resolves backup chain automatically.
      - $ref: '#/components/schemas/ProvisionServicePayload'
    CreateOracleDatabaseConfig:
      title: CreateOracleDatabaseConfig
      type: object
      nullable: true
      properties:
        parameterProfileId:
          type: string
          format: uuid
          description: The parameter profile ID for the database
        optionsProfile:
          type: string
          description: The options profile for the database
        optionProfileId:
          type: string
          format: uuid
          description: The options profile for the database
        username:
          type: string
          description: Username for the oracle database
        password:
          type: string
          description: Password for the oracle database
        pdbConfig:
          type: array
          items:
            $ref: '#/components/schemas/OraclePdbConfig'
    CreateDatabasePayload:
      title: CreateDatabasePayload
      type: object
      properties:
        databaseName:
          type: string
          minLength: 1
          maxLength: 128
          description: The name of the database to be created
        description:
          type: string
          maxLength: 512
          description: Description of database created
        sourceDatabaseId:
          type: string
          format: uuid
          description: Required while creating a clone. It specifies the Id of the source database from which the clone is being created.
        databaseConfiguration:
          type: object
          properties:
            oracleConfig:
              $ref: '#/components/schemas/CreateOracleDatabaseConfig'
            postgresqlConfig:
              $ref: '#/components/schemas/PostgresqlDatabaseConfig'
            mysqlConfig:
              $ref: '#/components/schemas/MySqlDatabaseConfig'
            sqlServerConfig:
              $ref: '#/components/schemas/SqlServerDatabaseConfig'
            mongodbConfig:
              $ref: '#/components/schemas/MongodbDatabaseConfig'
            milvusConfig:
              $ref: '#/components/schemas/MilvusDatabaseConfig'
        collectionConfig:
          $ref: '#/components/schemas/DbCollectionCreatePayload'
    MongodbEngineConfigPayload:
      title: MongodbEngineConfigPayload
      type: object
      required:
      - clusterName
      - parameterProfile
      properties:
        clusterName:
          type: string
          description: The MongoDB Cluster name. The name should start with a alphabet and must be alphanumeric.
          minLength: 1
          maxLength: 64
          pattern: ^[a-zA-Z][a-zA-Z0-9-]*$
        parameterProfileId:
          type: string
          format: uuid
          description: The parameter profile id for the database
    YearlySchedule:
      type: object
      properties:
        commonSchedule:
          $ref: '#/components/schemas/commonYearlySchedule'
        monthSpecificSchedule:
          type: array
          uniqueItems: true
          required:
          - months
          items:
            $ref: '#/components/schemas/MonthWiseDates'
    FullBackupSchedule:
      description: The schedule at which full backups would be triggered
      type: object
      properties:
        startTime:
          description: Optional Time when full backup(s) has to be captured | If not specified, the default time (same as incremental backup) would be used
          $ref: '#/components/schemas/TimeFormat'
        weeklySchedule:
          $ref: '#/components/schemas/WeeklySchedule'
    TimeZone:
      type: string
      description: The timezone detail
      maxLength: 256
    MilvusDatatype:
      type: string
      enum:
      - VARCHAR
      - INT64
      - BOOL
      - INT8
      - INT16
      - INT32
      - FLOAT
      - DOUBLE
      - JSON
      - BINARY_VECTOR
      - FLOAT_VECTOR
  parameters:
    service-id:
      name: service-id
      in: path
      required: true
      style: simple
      schema:
        type: string
        format: uuid
    id:
      name: id
      description: Id of entity
      in: path
      style: simple
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
