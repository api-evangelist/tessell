  /services/eligible-pdb-clone-targets:
    get:
      tags:
      - DB Service
      summary: Get list of services eligible as PDB clone targets
      description: 'Returns a list of Oracle services that are eligible to receive a cloned PDB from the specified source database.

        Only services that meet ALL eligibility criteria are included in the response.


        **Eligibility Criteria:**

        Services must meet ALL of the following requirements to be included:

        - **Engine Compatibility**: Target service must be Oracle with multi-tenant (CDB/PDB) architecture

        - **Version Compatibility**: Oracle version must be compatible (same or higher major version)

        - **Status**: Target service must be in an operational state (e.g., READY)

        - **Subscription Access**: User must have access to the target service (typically same subscription as source)

        - **Configuration Compatibility**: Target service must support the resource requirements of the source PDB

        - **PDB Capacity**: Target CDB must have capacity to host additional PDBs


        **Use Cases:**

        - Display available target services in UI dropdown when user initiates PDB clone operation

        - Pre-validate that at least one eligible target exists before showing clone form

        - Allow users to select from pre-filtered list of compatible services

        '
      operationId: getEligiblePdbCloneTargets
      parameters:
      - name: source-availability-machine-id
        in: query
        description: ID of the source availability machine
        required: true
        style: form
        schema:
          type: string
          format: uuid
      - name: source-database-id
        in: query
        description: ID of the source database (PDB) to be cloned
        required: true
        style: form
        schema:
          type: string
          format: uuid
      - name: load-instances
        in: query
        description: Load the instances that are part of the DB Service
        required: false
        style: form
        schema:
          type: boolean
          default: true
      - name: load-databases
        in: query
        description: Load the databases (PDBs) that are part of the DB Service
        required: false
        style: form
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageOffset'
      - $ref: '#/components/parameters/timeZone'
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TessellServicesResponse'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
