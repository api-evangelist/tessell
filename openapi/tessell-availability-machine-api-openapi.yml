openapi: 3.0.3
info:
  title: Tessell APIs activity-center Availability Machine API
  contact:
    email: support@tessell.com
    name: Tessell Inc
    url: https://www.tessell.com
  description: Tessell API Documentation
  termsOfService: https://www.tessell.com/terms
  version: '1.0'
servers:
- url: '{server}'
  variables:
    server:
      default: console.tessell.com
tags:
- name: Availability Machine
paths:
  /availability-machines:
    get:
      tags:
      - Availability Machine
      summary: Get a list of Availability Machines
      operationId: getAvailabilityMachines
      x-terraform-resource: AvailabilityMachine
      x-terraform-operation: ReadList
      x-terraform:
        excludeParamsFromApiDefinition:
        - pageSize
        - pageOffset
        - timeZone
      parameters:
      - name: name
        in: query
        description: Filter the result based on Availability Machine name
        required: false
        style: form
        schema:
          type: string
      - name: status
        in: query
        description: Filter the result based on Availability Machine status
        required: false
        style: form
        schema:
          type: string
      - name: engine-type
        in: query
        description: Filter the result based on Availability Machine's database engine-type
        required: false
        style: form
        schema:
          type: string
      - name: load-daps
        in: query
        description: Boolean to indicate if AM's DAPs to be fetched or not
        schema:
          type: boolean
          default: true
      - name: load-rpo-policy
        description: Load RPO policy configuration associated with the Availability Machine
        in: query
        style: form
        schema:
          type: boolean
          default: false
      - name: load-storage-config
        description: Load storage details of the corresponding DB Service
        in: query
        style: form
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/loadAcls'
      - $ref: '#/components/parameters/owners'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageOffset'
      - $ref: '#/components/parameters/timeZone'
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDmmsServiceView'
              examples:
                generic:
                  $ref: '#/components/examples/GetAvailabilityMachines'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /availability-machines/{id}:
    get:
      tags:
      - Availability Machine
      summary: Get details about an Availability Machine
      operationId: getAvailabilityMachine
      x-terraform-resource: AvailabilityMachine
      x-terraform-operation: Read
      x-terraform:
        excludeParamsFromApiDefinition:
        - loadAcls
        - timeZone
      parameters:
      - name: id
        in: path
        description: ID of the Availability Machine
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: load-daps
        in: query
        description: Boolean to indicate if AM's DAPs to be fetched or not
        schema:
          type: boolean
          default: true
      - name: load-rpo-policy
        description: Load RPO policy configuration associated with the Availability Machine
        in: query
        style: form
        schema:
          type: boolean
          default: true
      - name: load-storage-config
        description: Load storage details of the corresponding DB Service
        in: query
        style: form
        schema:
          type: boolean
          default: true
      - name: load-clones
        description: Load cloned DB Services details created using Availability Machine
        in: query
        style: form
        schema:
          type: boolean
          default: true
      - $ref: '#/components/parameters/loadAcls'
      - $ref: '#/components/parameters/timeZone'
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DmmConsumerView'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags:
      - Availability Machine
      summary: Delete the Availability Machine and the associated data (if any) including snapshots, sanitized-snapshots, and backups.
      operationId: deleteAvailabilityMachine
      parameters:
      - name: id
        in: path
        description: ID of the Availability Machine
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiStatus'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /availability-machines/{id}/pause:
    patch:
      tags:
      - Availability Machine
      summary: Pause the automated backups for a Availability Machine
      operationId: pauseAvailabilityMachine
      parameters:
      - name: id
        in: path
        description: Id of the Availability Machine
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PauseTessellDmmPayload'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiStatus'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /availability-machines/{id}/backup-download-config:
    patch:
      tags:
      - Availability Machine
      summary: Allow backup download for a Availability Machine
      operationId: updateBackupDownloadConfig
      parameters:
      - name: id
        in: path
        description: Id of the Availability Machine
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBackupDownloadConfigPayload'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupDownloadConfig'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /availability-machines/{id}/resume:
    patch:
      tags:
      - Availability Machine
      summary: Resume the automated backups for a Availability Machine
      operationId: resumeAvailabilityMachine
      parameters:
      - name: id
        in: path
        description: Id of the Availability Machine
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeTessellDmmPayload'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiStatus'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /availability-machines/{id}/acls:
    get:
      tags:
      - Availability Machine
      summary: Get list of ACLs for an Availability Machine
      operationId: getAvailabilityMachineAcls
      parameters:
      - name: id
        in: path
        description: ID of the Availability Machine
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityAclSharingInfo'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      tags:
      - Availability Machine
      summary: Create or update ACLs for an Availability Machine
      operationId: createAvailabilityMachineAcls
      parameters:
      - name: id
        in: path
        description: ID of the Availability Machine
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AclPayload'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AclPayload'
        '204':
          description: No Content
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags:
      - Availability Machine
      summary: Revoke ACLs for an Availability Machine
      operationId: revokeAvailabilityMachineAcls
      parameters:
      - name: id
        in: path
        description: ID of the Availability Machine
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AclRevokePayload'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiStatus'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /availability-machines/{id}/acls/eligible-users:
    get:
      tags:
      - Availability Machine
      summary: Get list of users which are eligible to grant access for an Availability Machine
      operationId: getEligibleUsersForAvailabilityMachine
      parameters:
      - name: id
        in: path
        description: ID of the Availability Machine
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: roles
        in: query
        description: Filter the result based on specified roles
        required: false
        style: form
        schema:
          type: array
          items:
            type: string
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AclEligibleUser'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /dataflix/{id}/catalog/backups/{backup-id}/download-url:
    get:
      tags:
      - Availability Machine
      summary: Get download url info for the backup
      operationId: getDownloadUrlInfo
      parameters:
      - name: id
        in: path
        description: Id of the Availability Machine
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: backup-id
        in: path
        description: ID of the backup
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataflixDownloadUrlInfo'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /dataflix/{id}/acls/eligible-users:
    get:
      tags:
      - Availability Machine
      summary: Get list of all the users by privileges
      operationId: getEligibleUsersForDataflix
      parameters:
      - name: id
        in: path
        description: Id of the Availability Machine
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: roles
        in: query
        description: roles
        required: false
        style: form
        schema:
          type: array
          items:
            type: string
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AclEligibleUser'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /availability-machines/{id}/size:
    get:
      tags:
      - Availability Machine
      summary: Get size consumption details for Tessell Data Management Machine
      operationId: getAvailabilityMachineSize
      parameters:
      - name: id
        in: path
        description: Id of the Availability Machine
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/timeZone'
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TessellDmmSizeDTO'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    TessellServiceInstanceRole:
      type: string
      description: DB Service instance role
      enum:
      - primary
      - read_only_replica
      - failover_replica
      - dr
    SubscriptionsCloudLocationsAndKey:
      type: object
      description: The cloud location information along with encryption key where the data is being managed by this Access Policy
      required:
      - subscriptionName
      - cloudRegionAndKey
      properties:
        subscriptionName:
          type: string
        cloudRegionAndKey:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/RegionToEncryptionKey'
        users:
          description: List of users email id who have access to the data/content managed by this Access Policy
          type: array
          items:
            type: string
    apiStatus:
      title: apiStatus
      type: object
      properties:
        status:
          type: string
        message:
          type: string
    ApiError:
      type: object
      description: Common error response object for non 2xx responses
      properties:
        code:
          type: string
          description: Status code for the error response
        message:
          type: string
          description: Error message for API response
        resolution:
          type: string
        timestamp:
          type: string
          format: date-time
        contextId:
          type: string
          description: ContextId of API request
        sessionId:
          type: string
          description: SessionId of API request
        tessellErrorCode:
          type: string
          description: Unique error code specific to Tessell
    commonYearlySchedule:
      allOf:
      - $ref: '#/components/schemas/DatesForEachMonth'
      - type: object
        properties:
          months:
            type: array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/Month'
              x-enum: true
    AzureNetAppCapacityPoolServiceLevel:
      type: string
      enum:
      - Standard
      - Premium
      - Ultra
      x-enum-varnames:
      - STANDARD
      - PREMIUM
      - ULTRA
    EntityAclSharingInfo:
      title: EntityAclSharingInfo
      description: Tessell Entity ACL Sharing Info
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/EntityUserAclSharingInfo'
    WeekDay:
      description: Week Days
      type: string
      enum:
      - Sunday
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      x-enum-varnames:
      - Sunday
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
    AwsInfraConfig:
      type: object
      title: AwsInfraConfig
      properties:
        awsCpuOptions:
          type: object
          title: AwsCpuOptions
          properties:
            vcpus:
              type: integer
              format: int32
              minimum: 0
              description: Number of vcpus for aws cpu options
    PerfInsightsStatus:
      title: PerfInsightsStatus
      type: string
      description: Perf insights status of a Service Instance
      enum:
      - ENABLED
      - ENABLING
      - DISABLED
      - DISABLING
      - FAILED_ENABLE
      - FAILED_DISABLE
    ScheduleInfo:
      type: object
      properties:
        backupStartTime:
          $ref: '#/components/schemas/TimeFormat'
        dailySchedule:
          $ref: '#/components/schemas/DailySchedule'
        weeklySchedule:
          $ref: '#/components/schemas/WeeklySchedule'
        monthlySchedule:
          $ref: '#/components/schemas/MonthlySchedule'
        yearlySchedule:
          $ref: '#/components/schemas/YearlySchedule'
    DapStatus:
      description: Database Access Policy Status
      type: string
      enum:
      - CREATING
      - ACTIVE
      - CREATION_FAILED
      - TO_BE_DELETED
      - DELETED
    WeeklySchedule:
      type: object
      properties:
        days:
          description: Days in a week to retain weekly backups for
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/WeekDay'
            x-enum: true
    InstanceExadataComputeConfig:
      type: object
      required:
      - infrastructureId
      - infrastructureName
      - vmClusterId
      - vmClusterName
      - vcpus
      - memory
      properties:
        infrastructureId:
          type: string
          format: uuid
        infrastructureName:
          type: string
        vmClusterId:
          type: string
          format: uuid
        vmClusterName:
          type: string
        vcpus:
          type: integer
        memory:
          type: integer
          format: int64
    TessellResourceUpdateInfo:
      title: TessellResourceUpdateInfo
      description: In progress update information for a Tessell Resource
      properties:
        updateType:
          x-computed: true
          type: string
          description: Type of the update
        referenceId:
          x-computed: true
          type: string
          format: uuid
          description: The reference-id of the update request
        submittedAt:
          x-computed: true
          type: string
          format: date-time
          description: Timestamp when the resource update was requested
        updateInfo:
          x-computed: true
          type: object
          description: The specific details for a Tessell resource that are being updated
          additionalProperties: {}
    AzureNetAppNetworkFeature:
      description: Azure NetApp network feature configuration for creating volume
      type: string
      enum:
      - Standard
      - Basic
      x-enum-varnames:
      - STANDARD
      - BASIC
    AzureNetAppEncryptionKeySource:
      enum:
      - Microsoft.NetApp
      - Microsoft.KeyVault
      x-enum-varnames:
      - MICROSOFT_NET_APP
      - MICROSOFT_KEY_VAULT
    AmDataIngestionStatus:
      description: Availability Machine's data ingestion status
      type: string
      enum:
      - ACTIVE
      - PAUSED
      - STOPPED
    ParameterProfile:
      title: ParameterProfile
      type: object
      x-computed: true
      properties:
        id:
          type: string
          format: uuid
          description: Tessell generated UUID for the the parameter profile
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: The name used to identify the parameter profile
        version:
          type: string
          format: uuid
          description: The version of the parameter profile associated with the instance
        status:
          $ref: '#/components/schemas/ParameterProfileStatus'
    PauseTessellDmmPayload:
      title: PauseTessellDmmPayload
      type: object
      description: This is a definition for pausing a Tessell Data Management Machine
      properties:
        pauseAtTime:
          type: string
          format: date-time
          description: Timestamp (in UTC) when the Availability Machine should be paused. If not specified, the Availability Machine would be paused immediately
    AzureNetAppConfigPayload:
      properties:
        azureNetAppId:
          description: Azure NetApp Id registered with Tessell
          type: string
          format: uuid
        capacityPoolId:
          description: Capacity pool Id of the Azure NetApp registered with Tessell
          type: string
          format: uuid
        configurations:
          description: Azure NetApp configurations
          type: object
          properties:
            networkFeatures:
              $ref: '#/components/schemas/AzureNetAppNetworkFeature'
    AsIsDapContent:
      title: AsIsDapContent
      type: object
      properties:
        automated:
          type: boolean
          description: Share the automated as-is snapshots. This is exclusive with manual specification.
        manual:
          description: The list of snapshots that are to be shared as part of this access policy
          type: array
          items:
            $ref: '#/components/schemas/DapManualInfo'
    Month:
      description: Name of a month
      type: string
      enum:
      - January
      - February
      - March
      - April
      - May
      - June
      - July
      - August
      - September
      - October
      - November
      - December
      x-enum-varnames:
      - January
      - February
      - March
      - April
      - May
      - June
      - July
      - August
      - September
      - October
      - November
      - December
    InstanceAzureNetAppConfig:
      description: Service instance level Azure NetApp config
      type: object
      properties:
        azureNetAppName:
          type: string
        capacityPoolName:
          type: string
        volumeName:
          type: string
        azureNetAppId:
          description: Azure NetApp Id registered with Tessell
          type: string
          format: uuid
        capacityPoolId:
          description: Capacity Pool Id of the Azure NetApp registered with Tessell
          type: string
          format: uuid
        delegatedSubnetId:
          description: Delegated Subnet name registered with Tessell for the Azure NetApp volume
          type: string
          format: uuid
        delegatedSubnetName:
          description: Delegated Subnet Id registered with Tessell for the Azure NetApp volume
          type: string
        encryptionKeyInfo:
          $ref: '#/components/schemas/AzureNetAppEncryptionKeyInfo'
        networkFeatures:
          $ref: '#/components/schemas/AzureNetAppNetworkFeature'
        serviceLevel:
          $ref: '#/components/schemas/AzureNetAppCapacityPoolServiceLevel'
    TessellServiceInstanceContextInfo:
      type: object
      description: Provide more context of Service Instance state
      properties:
        subStatus:
          $ref: '#/components/schemas/TessellServiceInstanceSubStatus'
        description:
          type: string
    TessellServiceInstanceDTO:
      title: TessellServiceInstanceDTO
      type: object
      description: This is a definition of the DB Service Instance object
      required:
      - name
      properties:
        id:
          type: string
          format: uuid
          description: Tessell generated UUID for the DB Service Instance
          x-computed: true
        name:
          type: string
          description: Name of the DB Service Instance
        instanceGroupName:
          type: string
          description: Name of the instance group
        type:
          $ref: '#/components/schemas/TessellServiceInstanceType'
          x-computed: true
          x-enum: true
        role:
          description: DB Service Topology
          $ref: '#/components/schemas/TessellServiceInstanceRole'
          x-computed: true
          x-enum: true
        status:
          $ref: '#/components/schemas/TessellServiceInstanceStatus'
          x-computed: true
          x-enum: true
        tessellServiceId:
          description: DB Service Instance's associated DB Service id
          type: string
          format: uuid
          x-computed: true
        cloud:
          description: DB Service Instance's cloud type
          type: string
          x-computed: true
        region:
          description: DB Service Instance's cloud region
          type: string
          x-computed: true
        availabilityZone:
          x-computed: true
          description: DB Service Instance's cloud availability zone
          type: string
        availabilitySet:
          type: string
          description: The availability set to which the Compute Resource belongs
          minLength: 1
          maxLength: 80
          x-computed: true
        instanceGroupId:
          description: The instance groupd Id
          type: string
          format: uuid
          x-computed: true
        computeType:
          description: The compute used for creation of the Tessell Service Instance
          type: string
          x-computed: true
        awsInfraConfig:
          $ref: '#/components/schemas/AwsInfraConfig'
          x-computed: true
        gcpInfraConfig:
          $ref: '#/components/schemas/GcpInfraConfig'
          x-computed: true
        computeId:
          description: The associated compute identifier
          type: string
