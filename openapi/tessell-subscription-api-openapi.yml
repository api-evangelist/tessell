          type: string
      requestBody:
        description: Cloud config map
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCloudConfigMap'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionAdminView'
        default:
