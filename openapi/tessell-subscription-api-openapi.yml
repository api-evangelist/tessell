        resolution:
          type: string
          description: End-user representation of resolution
        errorCode:
          $ref: '#/components/schemas/TessellHTTPErrorCode'
          description: User specific code might be different in some cases with internal code (Say some internal entity is not present, so 404 for Tessell while 500 for end-user
    GcpByoaExecutionOutput:
      type: object
      description: Output from 'terraform output -json' command executed at customer's GCP account. Each field is a Terraform output block with value, type, and sensitive properties.
      required:
      - subscription_info
      - vpc
      - security
      - storage
      properties:
        subscription_info:
          $ref: '#/components/schemas/TerraformOutputSubscriptionInfo'
          description: Terraform output block containing subscription metadata
        service_account:
          $ref: '#/components/schemas/TerraformOutputServiceAccount'
          description: Terraform output block containing service account information
        vpc:
          $ref: '#/components/schemas/TerraformOutputVpc'
          description: Terraform output block containing VPC network information
        security:
          $ref: '#/components/schemas/TerraformOutputSecurity'
          description: Terraform output block containing KMS security information
        storage:
          $ref: '#/components/schemas/TerraformOutputStorage'
          description: Terraform output block containing GCS storage information
        private_service_connect:
          $ref: '#/components/schemas/TerraformOutputPrivateServiceConnect'
          description: Terraform output block containing private service connect information
    AssociatedCloudTypeServiceConsumer:
      title: AssociatedCloudTypeServiceConsumer
      type: object
      description: Cloud specific details
      properties:
        cloudType:
          $ref: '#/components/schemas/cloudType'
        associationStatus:
          $ref: '#/components/schemas/AssociationStatus'
        regions:
          type: array
          items:
            $ref: '#/components/schemas/TenantRegion'
        associatingRegions:
          type: array
          description: List of associated regions with the subscription
          items:
            $ref: '#/components/schemas/TenantRegion'
        failedRegions:
          type: array
          description: List of regions which have failed during association or validation
          items:
            $ref: '#/components/schemas/TenantRegion'
        resourceGroupName:
          type: string
          description: This is specific to azure. It is the resource group name used when onboarding the subscription
        metadata:
          $ref: '#/components/schemas/SubscriptionCloudMetadata'
    TessellHTTPErrorCode:
      type: object
      properties:
        httpCode:
          type: integer
          description: HTTP code
        code:
          type: string
          description: Tessell's specific code with more context on error
    AclEligibleUser:
      title: AclEligibleUser
      description: Eligible user for sharing the entity
      properties:
        firstName:
          type: string
        lastName:
          type: string
        emailId:
          type: string
        eligibleRoles:
          type: array
          items:
            type: string
        accessibleSubscriptions:
          type: array
          items:
            type: string
          description: List of subscriptions user has access to
    AzureByoaExecutionOutputPrivateEndpoints:
      type: object
      description: Private endpoint resources created as part of arm template deployment
      required:
      - tessellControlPlanePrivateEndpoint
      properties:
        tessellControlPlanePrivateEndpoint:
          $ref: '#/components/schemas/AzureByoaExecutionOutputPrivateEndpoint'
          description: Private endpoint of Tessell Control Plane
        azureMonitorPrivateEndpoint:
          $ref: '#/components/schemas/AzureByoaExecutionOutputPrivateEndpoint'
          description: Private endpoint of Azure Log Monitor
    GcpStorage:
      type: object
      description: Storage (GCS) information from Terraform output
      required:
      - bucketName
      - bucketUrl
      - location
      properties:
        bucketName:
          type: string
          description: Name of the GCS bucket
          pattern: ^[a-z0-9][a-z0-9-_]*[a-z0-9]$
        bucketUrl:
          type: string
          description: URL of the GCS bucket
        location:
          type: string
          description: Location of the bucket (region or multi-region)
    GcpSubnetOutput:
      type: object
      description: Subnet information from Terraform output
      required:
      - id
      properties:
        id:
          type: string
          description: id of the subnet
    GcpKeyRing:
      type: object
      description: Cloud KMS key ring information
      required:
      - name
      - id
      - location
      properties:
        name:
          type: string
          description: Name of the key ring
          pattern: ^[a-zA-Z0-9_-]+$
        id:
          type: string
          description: Unique identifier of the key ring
        location:
          type: string
          description: Location of the key ring (region or multi-region)
    AwsByoaExecutionOutputSubnets:
      type: object
      properties:
        privateSubnets:
          type: array
          description: Private subnets created as part of the cloud formation deployment
          minItems: 1
          items:
            $ref: '#/components/schemas/AwsByoaExecutionOutputSubnet'
        publicSubnets:
          type: array
          description: Public subnets created as part of the cloud formation deployment
          minItems: 0
          items:
            $ref: '#/components/schemas/AwsByoaExecutionOutputSubnet'
    SubscriptionAwsConfig:
      allOf:
      - $ref: '#/components/schemas/SubscriptionCloudConfig'
      - title: SubscriptionAwsConfig
        type: object
        description: AWS configuration for the subscription
        properties:
          onboardingInfo:
            $ref: '#/components/schemas/SubscriptionAwsOnboardingConfig'
    AwsByoaExecutionOutputPrivateVPCEndpoint:
      type: object
      description: Private VPC endpoint created as part of CF template
      properties:
        endpointId:
          type: string
          description: Endpoint Id present in the cloud
        dnsName:
          type: string
          description: DNS name for the given endpoint
    SubscriptionByoaAzureStaticMetadata:
      title: SubscriptionByoaAzureStaticMetadata
      description: Azure metadata for BYOA
      required:
      - authorizeTessellUrl
      - authorizeTessellNetworkUrl
      - deployResourceUrl
      - tessellAppId
      - tessellNetworkAppId
      - command
      properties:
        authorizeTessellUrl:
          type: string
        authorizeTessellNetworkUrl:
          type: string
        deployResourceUrl:
          type: string
        tessellAppId:
          type: string
        tessellNetworkAppId:
          type: string
        command:
          type: string
    SubscriptionGcpOnboardingConfig:
      title: SubscriptionGcpOnboardingConfig
      type: object
      required:
      - onboardingType
      - executionOutput
      description: GCP onboarding configuration for the subscription
      properties:
        onboardingType:
          type: string
          enum:
          - TERRAFORM
          description: Medium used for onboarding GCP subscription. Allowed value is TERRAFORM
        executionOutput:
          $ref: '#/components/schemas/GcpByoaExecutionOutput'
    AzureByoaExecutionOutputVirtualNetwork:
      type: object
      description: Virtual network resources created as part of the arm template deployment
      required:
      - name
      - virtualNetworkId
      - privateSubnetId
      properties:
        name:
          type: string
          description: Name of the VPC
          minLength: 3
          maxLength: 64
        virtualNetworkId:
          type: string
          description: Virtual network Id of the VPC
          minLength: 114
        privateSubnetId:
          type: string
          description: Private Subnet Id of the VPC
          minLength: 124
        publicSubnetId:
          type: string
          description: Public Subnet Id of the VPC
          minLength: 124
    ExadataRegisterVm:
      type: object
      properties:
        computeResourceId:
          type: string
          format: uuid
        taId:
          type: string
          format: uuid
    AzureByoaExecutionOutputStorage:
      type: object
      description: Security level resources created as part of the arm template deployment
      required:
      - storageAccountId
      properties:
        storageAccountId:
          type: string
          description: Id of the storage account
          minLength: 1
    GcpVpc:
      type: object
      description: VPC network information from Terraform output
      required:
      - name
      - id
      - subnets
      properties:
        name:
          type: string
          description: Name of the VPC network
          pattern: ^[a-z][-a-z0-9]*[a-z0-9]$
        id:
          type: string
          description: Unique identifier of the VPC
        selfLink:
          type: string
          description: Self-link URL of the VPC network
        subnets:
          type: array
          description: List of subnets in the VPC
          items:
            $ref: '#/components/schemas/GcpSubnetOutput'
    SubscriptionResourceList:
      type: object
      properties:
        subscriptionName:
          type: string
          description: Name of the subscription
        subscriptionStatus:
          $ref: '#/components/schemas/subscriptionStatus'
          description: Status of the subscription
        hostedRegionsCount:
          type: integer
          description: count of hosted regions for the subscription
        resources:
          type: array
          description: List of resources under subscription preventing deletion
          items:
            type: object
            properties:
              resourceType:
                type: string
                description: Type of the resource (e.g., Database, Server)
                enum:
                - Database
                - Server
                - Availability Machines
                - Other
              count:
                type: integer
                description: Number of resources currently active
              description:
                type: string
                description: Detailed message about the issue
      example:
        subscriptionName: Wealth Management-Prod
        issues:
        - resourceType: Database
          count: 10
          status: 10 Database services are currently running.
          description: Stop or terminate all active DBs before attempting to delete the subscription. As apart from this, resources like NIC1, security groups, snapshots, backups will be deleted along with database service.
          note: In case if availability machine is retained for a service, snapshots & backups will be retained.
          actionLabel: Open My Services App
          actionLink: ''
        - resourceType: Server
          count: 2
          status: 2 Servers are currently running.
          description: Database services are online on this server. Terminate them before attempting to delete the subscription.
          actionLabel: Open Servers App
          actionLink: ''
    GcpSecurity:
      type: object
      description: Security (KMS) information from Terraform output
      required:
      - keyRing
      - cryptoKey
      properties:
        keyRing:
          $ref: '#/components/schemas/GcpKeyRing'
        cryptoKey:
          $ref: '#/components/schemas/GcpCryptoKey'
    SubscriptionUsersAdminView:
      title: SubscriptionUsersAdminView
      type: object
      description: Details of the subscription users
      properties:
        metadata:
          $ref: '#/components/schemas/apiMetadata'
        response:
          type: array
          description: List of user details
          items:
            $ref: '#/components/schemas/SubscriptionUserAdminView'
    AzureByoaExecutionOutputPrivateEndpoint:
      title: AzureByoaExecutionOutputPrivateEndpoint
      type: object
      properties:
        privateEndpointConnectionName:
          type: string
        privateEndpointName:
          type: string
        privateEndpointId:
          type: string
        privateEndpointIp:
          type: string
        privateLinkServiceId:
          type: string
    SubscriptionAdminView:
      title: SubscriptionConsumerView
      description: Admin view of the subscription
      type: object
      properties:
        name:
          type: string
          description: Subscription name
        description:
          type: string
          description: Subscription description
        isDefault:
          type: boolean
          default: false
          description: Specifies if this is the default subscription
        deploymentType:
          $ref: '#/components/schemas/subscriptionDeploymentType'
        status:
          $ref: '#/components/schemas/subscriptionStatus'
        associatedCloudTypes:
          type: array
          items:
            $ref: '#/components/schemas/AssociatedCloudTypeServiceConsumer'
        dateCreated:
          type: string
          format: date-time
          example: '2020-02-02 10:10:10'
          description: Timestamp when the subscription was created
        owner:
          type: string
          description: Owner of the subscription
        sharedWith:
          $ref: '#/components/schemas/EntityAclSharingInfo'
        isTessellAllowedToCreateKeyAndVnet:
          type: boolean
          default: true
          description: Specifies if Tessell is allowed to create resources in the selected resource group
        commonEndpointCutoverDone:
          type: boolean
          default: true
          description: Specifies if subscription has migrated to common endpoint completely
    SubscriptionGcpConfig:
      allOf:
      - $ref: '#/components/schemas/SubscriptionCloudConfig'
      - title: SubscriptionGcpConfig
        type: object
        description: GCP configuration for the subscription
        properties:
          onboardingInfo:
            $ref: '#/components/schemas/SubscriptionGcpOnboardingConfig'
    AwsByoaExecutionOutput:
      type: object
      description: Output from the execution done at customer's account either via cloud formation or via script
      required:
      - region
      - resources
      properties:
        allowTessellCreation:
          type: boolean
          description: Whether Tessell is given create permissions or not
          default: false
        resources:
          $ref: '#/components/schemas/AwsByoaExecutionOutputResources'
          description: Resources created as part of the cloud formation deployment
        region:
          type: string
          description: Region in which the stack was deployed
          minLength: 1
          maxLength: 36
        tenantAccountId:
          type: string
          description: Aws Account id of the tenant
          minLength: 12
          maxLength: 12
    AzureByoaExecutionOutputSecurity:
      type: object
      description: Security level resources created as part of the arm template deployment
      required:
      - keyName
      - diskEncryptionSetId
      properties:
        keyName:
          type: string
          description: Name of the key
          minLength: 1
          maxLength: 127
        diskEncryptionSetId:
          type: string
          description: Id of the disk encryption set
          minLength: 117
    SubscriptionCloudConfigMap:
      title: SubscriptionCloudConfigMap
      type: object
      description: Cloud configurations for the subscription
      properties:
        aws:
          $ref: '#/components/schemas/SubscriptionAwsConfig'
        azure:
          $ref: '#/components/schemas/SubscriptionAzureConfig'
        oci:
          $ref: '#/components/schemas/SubscriptionOciConfig'
        gcp:
          $ref: '#/components/schemas/SubscriptionGcpConfig'
    Step:
      title: Step
      type: object
      description: Step details
      properties:
        id:
          type: string
          description: Id of the step
        name:
          type: string
          description: Name of the step
        type:
          type: string
          description: Type of the step
        status:
          $ref: '#/components/schemas/ActivityStatus'
          description: Status of the step
        retryable:
          type: boolean
          default: true
          description: Whether the step can be retried or not
        skippable:
          type: boolean
          default: true
          description: Whether the step can be skipped or not
        error:
          $ref: '#/components/schemas/StepError'
          description: Error details in case of failures
        subSteps:
          type: array
          description: Child steps
          items:
            $ref: '#/components/schemas/Step'
    SubscriptionAzureOnboardingConfig:
      title: SubscriptionAzureOnboardingConfig
      type: object
      required:
      - onboardingType
      - executionOutput
      description: Azure onboarding configuration for the subscription
      properties:
        onboardingType:
          type: string
          enum:
          - ARM_DEPLOYMENT
          - SCRIPT
        executionOutput:
          $ref: '#/components/schemas/AzureByoaExecutionOutput'
    SubscriptionOciOnboardingConfig:
      title: SubscriptionOciOnboardingConfig
      type: object
      required:
      - onboardingType
      - executionOutput
      description: OCI onboarding configuration for the subscription
      properties:
        onboardingType:
          type: string
          enum:
          - TERRAFORM
          description: Medium used for onboarding oci subscription. Allowed value is TERRAFORM
        executionOutput:
          $ref: '#/components/schemas/OciByoaExecutionOutput'
    SubscriptionsAdminApiResponse:
      title: SubscriptionsAdminApiResponse
      type: object
      description: Api response for admin view of subscription
      properties:
        metadata:
          $ref: '#/components/schemas/apiMetadata'
        response:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionAdminView'
    AwsByoaExecutionOutputSecurity:
      type: object
      description: Security level resources created as part of the cloud formation deployment
      required:
      - keyId
      - keyName
      properties:
        keyId:
          type: string
          description: Id of the key
          minLength: 3
          maxLength: 127
        keyName:
          type: string
          description: Name of the key
          minLength: 1
          maxLength: 127
    AwsByoaExecutionOutputVpc:
      type: object
      description: VPC resources created as part of the cloud formation deployment
      required:
      - name
      - vpcId
      - subnets
      properties:
        name:
          type: string
          description: Name of the VPC
          minLength: 3
          maxLength: 64
        vpcId:
          type: string
          description: Virtual network Id of the VPC
          minLength: 10
        enablePublicAccess:
          type: boolean
          description: Whether Public Access is enabled or not
          default: true
        subnets:
          $ref: '#/components/schemas/AwsByoaExecutionOutputSubnets'
    SubscriptionCloudMetadata:
      title: SubscriptionCloudMetadata
      type: object
      description: Subscription related metadata
      properties:
        gcp:
          type: object
          description: GCP related metadata
          properties:
            projectId:
              type: string
              description: GCP Project ID where resources are deployed
            networkProjectId:
              type: string
              description: GCP Project ID where VPC network is located
        ociComputeCompartmentsInfo:
          type: array
          description: Info of the compute compartments
          items:
            type: object
            properties:
              compartmentId:
                $ref: '#/components/schemas/CompartmentOcid'
              compartmentName:
                type: string
                minLength: 1
  parameters:
    pageOffset:
      name: page-offset
      in: query
      description: Page offset for get query
      required: false
      schema:
        type: integer
        format: int32
        default: 0
    subscription-name:
      name: name
      in: path
      description: Subscription Name
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 64
    stepId:
      name: step-id
      in: path
      required: true
      description: ID of the step
      schema:
        type: string
        minLength: 1
        maxLength: 128
    soft-delete:
      name: soft-delete
      in: query
      description: Specifies whether to retain the subscription metadata
      required: false
      schema:
        type: boolean
        default: true
    pageSize:
      name: page-size
      in: query
      description: Page size for get query
      required: false
      schema:
        type: integer
        format: int32
        default: 10
    timeZone:
      name: time-zone
      in: query
      description: Timezone for return data
      required: false
      schema:
        type: string
        default: UTC
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
