openapi: 3.0.3
info:
  title: Tessell APIs activity-center Compute Resource API
  contact:
    email: support@tessell.com
    name: Tessell Inc
    url: https://www.tessell.com
  description: Tessell API Documentation
  termsOfService: https://www.tessell.com/terms
  version: '1.0'
servers:
- url: '{server}'
  variables:
    server:
      default: console.tessell.com
tags:
- name: Compute Resource
paths:
  /compute-resources/dbservers:
    get:
      tags:
      - Compute Resource
      summary: View a list of available Compute Resources
      operationId: getDbserverComputeResources
      parameters:
      - name: name
        in: query
        description: Filter Compute Resource based on name
        required: false
        style: form
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: load-db-services
        in: query
        description: Flag to load DB Service instances hosted on the DB Servers
        required: false
        style: form
        schema:
          type: boolean
          default: false
      - name: machine-type
        in: query
        description: machine-type
        required: false
        style: form
        schema:
          $ref: '#/components/schemas/MachineType'
      - name: providerAccountId
        in: query
        description: Filter Compute Resource provider Id
        required: false
        style: form
        schema:
          type: string
          format: uuid
      - name: providerSubAcctId
        in: query
        description: Filter Compute Resource provider sub account Id
        style: form
        schema:
          type: string
          format: uuid
      - name: load-updates-info
        in: query
        description: Include update availability information for each DB Server
        required: false
        style: form
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageOffset'
      - $ref: '#/components/parameters/timeZone'
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TessellDbserverComputeResourceListResponse'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /compute-resources/dbservers/{id}:
    get:
      tags:
      - Compute Resource
      summary: Get a Compute Resource by ID
      operationId: getDbserverComputeResource
      parameters:
      - name: id
        in: path
        description: The ID of the Compute Resource
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: load-updates-info
        in: query
        description: Include update availability information for the DB Server
        required: false
        style: form
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/timeZone'
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TessellDbserverComputeResourceDTO'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags:
      - Compute Resource
      summary: Delete a Database Server
      operationId: deleteDbserverComputeResource
      parameters:
      - name: id
        in: path
        description: id
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/taskSummary'
        '204':
          description: No Content
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      tags:
      - Compute Resource
      summary: Update a DB server
      operationId: updateDbServer
      x-terraform-resource: DBServer
      x-terraform-operation: Update
      parameters:
      - name: id
        in: path
        description: The ID of the DB Server
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDbServerPayload'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TessellDbserverComputeResourceDTO'
        '201':
          description: Created
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /compute-resources/dbservers/sharing-enabled:
    get:
      tags:
      - Compute Resource
      summary: View a list of available Compute Resources that can be used for newer provisioning
      operationId: getSharingEnabledDbserverComputeResources
      parameters:
      - name: subscription-id
        in: query
        description: Filter Compute Resources based on subscription ID
        required: false
        style: form
        schema:
          type: string
          format: uuid
      - name: engine-type
        in: query
        description: Filter Compute Resources based on engine type
        required: false
        style: form
        schema:
          $ref: '#/components/schemas/databaseEngineType'
      - name: cloud
        in: query
        description: Filter Compute Resources based on cloud type
        required: false
        style: form
        schema:
          $ref: '#/components/schemas/cloudType'
      - name: region
        in: query
        description: Filter Compute Resources based on cloud region
        required: false
        style: form
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: load-updates-info
        in: query
        description: Include update availability information for each DB Server
        required: false
        style: form
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageOffset'
      - $ref: '#/components/parameters/timeZone'
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharableDbserverComputeResourceListResponse'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /compute-resources/dbservers/{id}/enable-compute-sharing:
    patch:
      tags:
      - Compute Resource
      summary: Enable compute resource sharing
      operationId: enableComputeResourceSharing
      parameters:
      - $ref: '#/components/parameters/id'
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnableComputeSharingPayload'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiStatus'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /compute-resources/dbservers/{id}/owner:
    patch:
      tags:
      - Compute Resource
      summary: Update compute resource owner
      operationId: updateComputeResourceOwner
      parameters:
      - $ref: '#/components/parameters/id'
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateComputeResourceOwnerPayload'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiStatus'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /compute-resources/dbservers/owner/{email-id}:
    patch:
      tags:
      - Compute Resource
      summary: Update owner for all compute resources of a given owner
      description: Bulk update the owner for all compute resources currently owned by the specified user
      operationId: bulkUpdateComputeResourceOwner
      parameters:
      - name: email-id
        in: path
        description: Id of the owner
        required: true
        style: simple
        schema:
          type: string
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateComputeResourceOwnerPayload'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiStatus'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /compute-resources/dbservers/{id}/timeline:
    get:
      tags:
      - Compute Resource
      summary: Get a Compute Resource by ID
      operationId: getDbServerTimeline
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/timeZone'
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbServerTimelineResponse'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /compute-resources/dbservers/{id}/resize:
    patch:
      tags:
      - Compute Resource
      summary: Resize a Database Server Compute Resource
      operationId: resizeDbServerComputeResource
      parameters:
      - $ref: '#/components/parameters/id'
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResizeDbServerComputeResourceRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/taskSummary'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /compute-resources/dbservers/{id}/start:
    patch:
      tags:
      - Compute Resource
      summary: Starts Database Server Compute Resource
      operationId: startDbServer
      parameters:
      - $ref: '#/components/parameters/id'
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartDbServerPayload'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/taskSummary'
              examples:
                generic:
                  $ref: '#/components/examples/StartDbServerSummary'
        '201':
          description: Created
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /compute-resources/dbservers/{id}/stop:
    patch:
      tags:
      - Compute Resource
      summary: Stops the DB Service
      operationId: stopDbServer
      parameters:
      - $ref: '#/components/parameters/id'
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopDbServerPayload'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/taskSummary'
              examples:
                generic:
                  $ref: '#/components/examples/StopDbServerSummary'
        '201':
          description: Created
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /compute-resources/dbservers/{id}/maintenance-windows:
    patch:
      tags:
      - Compute Resource
      summary: Patch request for compute resource maintenance window
      operationId: updateMaintenanceWindowForDbServer
      parameters:
      - $ref: '#/components/parameters/id'
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputeResourceMaintenanceWindow'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeResourceMaintenanceWindow'
        '201':
          description: Created
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /compute-resources/dbservers/{id}/tags:
    get:
      tags:
      - Compute Resource
      summary: View tags for the DB Server
      operationId: getDbServerTags
      parameters:
      - $ref: '#/components/parameters/id'
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TessellTag'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      tags:
      - Compute Resource
      summary: Create/update (override) tags for the DB Server
      operationId: upsertDbServerTags
      parameters:
      - name: id
        in: path
        description: The ID of the DB Server
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUpdateTessellTagPayload'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TessellTag'
        '201':
          description: Created
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags:
      - Compute Resource
      summary: Delete tags for a DB Server
      operationId: deleteDbServerTags
      parameters:
      - name: id
        in: path
        description: The ID of the DB Server
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteTagPayload'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiStatus'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /compute-resources/dbservers/{id}/integrations:
    patch:
      tags:
      - Compute Resource
      summary: Add/update an integration for the DB Server
      operationId: updateComputeResourceIntegration
      parameters:
      - $ref: '#/components/parameters/id'
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TessellUpdateDatabaseIntegrationDTO'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/taskSummary'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    TessellServiceInstanceRole:
      type: string
      description: DB Service instance role
      enum:
      - primary
      - read_only_replica
      - failover_replica
      - dr
    apiStatus:
      title: apiStatus
      type: object
      properties:
        status:
          type: string
        message:
          type: string
    ApiError:
      type: object
      description: Common error response object for non 2xx responses
      properties:
        code:
          type: string
          description: Status code for the error response
        message:
          type: string
          description: Error message for API response
        resolution:
          type: string
        timestamp:
          type: string
          format: date-time
        contextId:
          type: string
          description: ContextId of API request
        sessionId:
          type: string
          description: SessionId of API request
        tessellErrorCode:
          type: string
          description: Unique error code specific to Tessell
    PatchType:
      type: string
      enum:
      - CRITICAL
      - NON_CRITICAL
      description: Type of patch
    EnableComputeSharingPayload:
      type: object
      properties:
        enableSharing:
          type: boolean
    TessellIntegrationRequestType:
      type: string
      description: Request type enum for the addition/removal/updation of the Integration for the DB Service.
      enum:
      - ADD
      - UPDATE
      - REMOVE
    AzureNetAppCapacityPoolServiceLevel:
      type: string
      enum:
      - Standard
      - Premium
      - Ultra
      x-enum-varnames:
      - STANDARD
      - PREMIUM
      - ULTRA
    apiResponse:
      example:
        metadata:
          pagination:
            pageOffset: 0
            pageSize: 6
          records: 1
          timeZone: timeZone
        response: '{}'
      properties:
        metadata:
          $ref: '#/components/schemas/apiMetadata'
        response:
          type: object
      title: ApiResponse
      type: object
    EntityAclSharingInfo:
      title: EntityAclSharingInfo
      description: Tessell Entity ACL Sharing Info
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/EntityUserAclSharingInfo'
    TessellTag:
      title: TessellTag
      type: object
      nullable: true
      properties:
        name:
          description: Case sensitive, tag name
          type: string
          maxLength: 128
          minLength: 1
        value:
          description: Case sensitive, tag value
          type: string
          maxLength: 256
          minLength: 0
    apiPaginationInfo:
      title: apiPaginationInfo
      type: object
      properties:
        pageSize:
          type: integer
          format: int32
        pageOffset:
          type: integer
          format: int32
    TessellServiceStatus:
      type: string
      description: The current status of the DB Service
      enum:
      - CREATING
      - FAILED
      - READY
      - STOPPING
      - STOPPED
      - DEGRADED
      - HEALING
      - DOWN
      - STARTING
      - DELETING
      - SWITCHOVER
      - REBUILDING
      - PATCHING
      - PATCH_FAILED
      - UPDATING
      - UNDER_MAINTENANCE
      - REFRESHING
      - RESTORING
      - RESTORE_FAILED
    ParameterProfileStatus:
      type: string
      description: Association status of the instance to the parameter profile
      enum:
      - IN_SYNC
      - UPDATING
      - OUT_OF_SYNC
      - PENDING_REBOOT
    DbServerStorageConfig:
      type: object
      properties:
        provider:
          $ref: '#/components/schemas/StorageProviderType'
    UpdateDbServerPayload:
      type: object
      properties:
        name:
          type: string
          description: If not specified, this field will be ignored and the existing value will be assumed.
        description:
          type: string
          description: If not specified, this field will be ignored and the existing value will be assumed.
        enableDeletionProtection:
          type: boolean
          description: If not specified, this field will be ignored and the existing setting will be assumed.
        enableStopProtection:
          type: boolean
          description: If not specified, this field will be ignored and the existing setting will be assumed.
        restrictProvision:
          type: boolean
          description: If not specified, this field will be ignored and the existing setting will be assumed.
    ComputeResourceSubStatus:
      type: string
      description: DB Server could have a sub status associated along with status
      enum:
      - REBUILDING
      - REBUILD_FAILED
      - START_FAILED
      - STOP_FAILED
      - UPDATING_SECURITY_CONFIG
      - SECURITY_CONFIG_UPDATE_FAILED
    TaskStatus:
      type: string
      description: The status of Task
      enum:
      - AVAILABLE
      - QUEUED
      - CANCELLED
      - OVERRIDDEN
      - IN_PROGRESS
      - SUCCESS
      - FAILED
    InstanceStorageConfig:
      type: object
      properties:
        provider:
          $ref: '#/components/schemas/StorageProviderType'
        volumeType:
          type: string
          description: Data disk volume type
        fsxNetAppConfig:
          $ref: '#/components/schemas/InstanceFsxNetAppConfig'
        azureNetAppConfig:
          $ref: '#/components/schemas/InstanceAzureNetAppConfig'
    CrMaintenanceWindowPreference:
      enum:
      - MONTHLY
      - WEEKLY
      - QUARTERLY
      - NO_PREFERENCE
    tessellServiceTopology:
      type: string
      description: DB Service topology. This would specify whether the DB Service is single-node, or multi-node.
      enum:
      - single_instance
      - high_availability
    cloudType:
      description: Tessell supported cloud types
      type: string
      enum:
      - AWS
      - AZURE
      - GCP
      - OCI
    ResizeDbServerComputeResourceRequest:
      type: object
      required:
      - computeType
      properties:
        computeType:
          type: string
          description: The new compute type for the DB Server
    ComputeConfig:
      type: object
      properties:
        provider:
          $ref: '#/components/schemas/ComputeProviderType'
        exadataConfig:
          $ref: '#/components/schemas/ExadataComputeConfig'
    DBServiceOnComputeResource:
      description: DB Service details hosted on a compute resource
      properties:
        id:
          type: string
          format: uuid
          description: ID of the DB Service
        name:
          type: string
          description: Name of the DB Service
        engineType:
          $ref: '#/components/schemas/databaseEngineType'
        topology:
          $ref: '#/components/schemas/tessellServiceTopology'
        dbServiceStatus:
          $ref: '#/components/schemas/TessellServiceStatus'
        instanceId:
          type: string
          format: uuid
        instanceName:
          type: string
          minLength: 1
          maxLength: 128
        role:
          $ref: '#/components/schemas/TessellServiceInstanceRole'
        instanceStatus:
          $ref: '#/components/schemas/TessellServiceInstanceStatus'
        parameterProfileId:
          type: string
          format: uuid
        parameterProfileName:
          type: string
        parameterProfileStatus:
          $ref: '#/components/schemas/ParameterProfileStatus'
        maxMemory:
          type: integer
          format: int64
          description: The allocated max memory (in bytes) for this instance
          default: 0
          minimum: 0
        storage:
          type: integer
          format: int64
          description: The storage (in bytes) that has been provisioned for the DB Service instance
          default: 0
          minimum: 0
        servicePort:
          type: integer
          format: int32
          minimum: 0
        allowedIpAddresses:
          type: array
          description: The list of allowed ipv4 addresses that can connect to the DB Service. If not specified, this field will be ignored and the existing setting will be assumed.
          items:
            type: string
            format: ip4
        databases:
          type: array
          uniqueItems: true
          items:
            type: string
        sid:
          type: string
        owner:
          type: string
          description: This field specifies who is the owner for the DB Service
        computeConfig:
          $ref: '#/components/schemas/ComputeConfig'
        storageConfig:
          $ref: '#/components/schemas/DbServerStorageConfig'
        archiveStorageConfig:
          $ref: '#/components/schemas/InstanceStorageConfig'
        dateCreated:
          type: string
          format: date-time
        softwareImageVersion:
          type: string
    taskSummary:
      title: taskSummary
      type: object
      properties:
        taskId:
          type: string
          format: uuid
        taskType:
          type: string
        resourceId:
          type: string
