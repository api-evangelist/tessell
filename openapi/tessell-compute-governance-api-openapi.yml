openapi: 3.0.3
info:
  title: Tessell APIs activity-center Compute Governance API
  contact:
    email: support@tessell.com
    name: Tessell Inc
    url: https://www.tessell.com
  description: Tessell API Documentation
  termsOfService: https://www.tessell.com/terms
  version: '1.0'
servers:
- url: '{server}'
  variables:
    server:
      default: console.tessell.com
tags:
- name: Compute Governance
paths:
  /compute-service/governance/computes:
    get:
      tags:
      - Compute Governance
      summary: Get all compute profiles.
      description: Get all compute profiles.
      operationId: getAllComputeProfiles
      parameters:
      - $ref: '#/components/parameters/tenantIdMandatory'
      - $ref: '#/components/parameters/include-availability-in-query'
      - $ref: '#/components/parameters/subscription-name-in-query'
      - $ref: '#/components/parameters/cloud-type-in-query'
      - $ref: '#/components/parameters/use-cases-in-query'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageOffset'
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComputeAdminView'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /compute-service/governance/computes/{name}/subscription/{subscription-name}:
    patch:
      tags:
      - Compute Governance
      summary: Enable/Disable compute profile
      description: Enable/Disable compute profile
      operationId: updateComputeStatus
      parameters:
      - $ref: '#/components/parameters/tenantIdMandatory'
      - $ref: '#/components/parameters/compute-name-in-path'
      - $ref: '#/components/parameters/subscription-name-in-path'
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateComputeStatusRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiStatus'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /compute-service/governance/computes/{name}/subscription/{subscription-name}/regions:
    patch:
      tags:
      - Compute Governance
      summary: Update compute regions
      description: Update compute regions
      operationId: updateComputeRegions
      parameters:
      - $ref: '#/components/parameters/tenantIdMandatory'
      - $ref: '#/components/parameters/compute-name-in-path'
      - $ref: '#/components/parameters/subscription-name-in-path'
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateComputeRegionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateComputeRegionResponse'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ComputeProfileInfo:
      description: Compute Profile Metadata
      type: object
      properties:
        readIops:
          description: Read IOPS throughput supported by an instance
          type: integer
        writeIops:
          description: Write IOPS throughput supported by an instance
          format: int32
          type: integer
        memoryGB:
          description: Amount of memory (GB) in this compute
          format: float
          type: number
        maxNoOfDisks:
          description: No of disks attached to a compute instance
          format: int32
          type: integer
        minStorageGB:
          description: Amount of min storage (GB) supported by this compute shape (Only for Standard)
          format: int32
          type: integer
        maxStorageGB:
          description: Amount of max storage (GB) supported by this compute shape (Only for Standard)
          format: int32
          type: integer
        storageGB:
          description: Amount of storage (GB) supported by this compute shape (Only for High Performance)
          format: int32
          type: integer
        vcpus:
          description: Number of VCPUs in this compute
          format: int32
          type: integer
        allowedVcpuValues:
          description: Allowed Values of Vcpu in the shape
          type: array
          items:
            format: int32
            type: integer
        io2BlockExpressEnabled:
          description: Shape Supports io2 Block Express volume
          type: boolean
          default: false
        workloadType:
          description: Type of compute
          type: string
        architecture:
          $ref: '#/components/schemas/ComputeArchitecture'
        maxThroughputMBps:
          $ref: '#/components/schemas/computeProfileMaxThroughputMBps'
        maxBurstThroughputMBps:
          $ref: '#/components/schemas/computeProfileMaxBurstThroughputMBps'
        maxIops:
          $ref: '#/components/schemas/computeProfileMaxIops'
        maxBurstIops:
          $ref: '#/components/schemas/computeProfileMaxBurstIops'
    apiStatus:
      title: apiStatus
      type: object
      properties:
        status:
          type: string
        message:
          type: string
    ApiError:
      type: object
      description: Common error response object for non 2xx responses
      properties:
        code:
          type: string
          description: Status code for the error response
        message:
          type: string
          description: Error message for API response
        resolution:
          type: string
        timestamp:
          type: string
          format: date-time
        contextId:
          type: string
          description: ContextId of API request
        sessionId:
          type: string
          description: SessionId of API request
        tessellErrorCode:
          type: string
          description: Unique error code specific to Tessell
    UpdateComputeRegionResponse:
      type: object
      properties:
        subscriptionName:
          type: string
        name:
          type: string
        cloud:
          $ref: '#/components/schemas/cloudType'
        regions:
          type: array
          items:
            type: string
    StorageUtilizationDatabaseEngineTypes:
      description: Database Engine Type
      type: string
      enum:
      - GENERIC
      - ORACLE
      - POSTGRESQL
      - SQLSERVER
      - MYSQL
      - APACHE_KAFKA
      - MONGODB
      - MILVUS
    ComputeUseCase:
      description: Compute Use Cases
      type: string
      enum:
      - PROVISIONING
      - BMA
      - MILVUS
    ComputeArchitecture:
      description: Compute Architecture
      type: string
      enum:
      - x86
      - arm64
    ComputeProfileStatus:
      description: Compute Profile Response
      type: string
      x-dao-query: true
      x-dao-annotations: "@Enumerated(EnumType.STRING)\n  @NotNull\n"
      enum:
      - ENABLED
      - DISABLED
      - DELETED
    ComputeAdminView:
      description: Compute Response Object
      type: object
      properties:
        description:
          type: string
          description: Description of the Compute.
          maxLength: 512
        name:
          type: string
          maxLength: 128
          description: Name of the Tessell Compute
        family:
          type: string
          maxLength: 128
          description: Name of the Tessell Family
        cloudType:
          $ref: '#/components/schemas/cloudType'
        availability:
          type: array
          items:
            type: object
            properties:
              subscriptionName:
                type: string
                example: default
              status:
                $ref: '#/components/schemas/ComputeProfileStatus'
              regions:
                type: array
                items:
                  type: string
                example:
                - us-east-1
                - eu-west-2
              allRegions:
                type: array
                items:
                  type: string
                example:
                - us-east-1
                - us-east-2
                - eu-west-2
        tsm:
          type: boolean
          default: false
          description: Is TSM Shape
        profileInfo:
          $ref: '#/components/schemas/ComputeProfileInfo'
        useCases:
          type: array
          items:
            $ref: '#/components/schemas/ComputeUseCase'
        metadata:
          $ref: '#/components/schemas/ComputeMetadata'
        vmCompatibility:
          $ref: '#/components/schemas/ComputeVmCompatibility'
    computeProfileMaxIops:
      type: integer
      format: int32
      description: Maximum IOPS supported by underlying disks
    ComputeVmCompatibility:
      type: object
      description: VM compatibility requirements for a compute shape
      properties:
        diskControllerTypes:
          type: array
          description: Disk controller types supported by this compute shape (e.g. SCSI, NVME). Sourced from Azure SKU API DiskControllerTypes capability.
          items:
            $ref: '#/components/schemas/DiskControllerType'
    UpdateComputeRegionRequest:
      type: object
      properties:
        cloud:
          $ref: '#/components/schemas/cloudType'
        regions:
          type: array
          items:
            type: string
      required:
      - cloud
      - regions
    cloudType:
      description: Tessell supported cloud types
      type: string
      enum:
      - AWS
      - AZURE
      - GCP
      - OCI
    computeProfileMaxThroughputMBps:
      type: integer
      format: int32
      description: Maximum Throughput supported by underlying disks (in MB/s)
    ComputeMetadata:
      title: ComputeMetadata
      type: object
      description: Metadata for a compute resource
      properties:
        storageUtilizations:
          type: array
          items:
            type: object
            properties:
              engineType:
                $ref: '#/components/schemas/StorageUtilizationDatabaseEngineTypes'
              tsmMetaSize:
                type: integer
              tsmUsableStorageGB:
                type: integer
    computeProfileMaxBurstIops:
      type: integer
      format: int32
      description: Maximum Burst IOPS supported by underlying disks
    DiskControllerType:
      description: Disk controller type supported by a compute shape
      type: string
      enum:
      - SCSI
      - NVME
    UpdateComputeStatusRequest:
      type: object
      properties:
        cloud:
          $ref: '#/components/schemas/cloudType'
        status:
          $ref: '#/components/schemas/ComputeProfileStatus'
      required:
      - cloud
      - status
    computeProfileMaxBurstThroughputMBps:
      type: integer
      format: int32
      description: Maximum Burst Throughput supported by underlying disks (in MB/s)
  parameters:
    pageOffset:
      name: page-offset
      in: query
      description: Page offset for get query
      required: false
      schema:
        type: integer
        format: int32
        default: 0
    subscription-name-in-query:
      in: query
      name: subscription-name
      description: Subscription Name
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: default
    use-cases-in-query:
      name: use-cases
      in: query
      description: Use Case of the compute
      required: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ComputeUseCase'
    subscription-name-in-path:
      in: path
      name: subscription-name
      description: Subscription Name
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: default
    tenantIdMandatory:
      name: tenant-id
      in: header
      description: Id of the Tenant
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        example: 12345678-abcd-1234-abcd-1234abcd5678
    compute-name-in-path:
      in: path
      name: name
      description: Compute Name
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: tesl_2_b
    cloud-type-in-query:
      name: cloud-type
      in: query
      description: Cloud type of the compute
      required: false
      explode: true
      schema:
        $ref: '#/components/schemas/cloudType'
      style: form
      example:
        cloudType: aws
    include-availability-in-query:
      in: query
      name: include-availability
      description: Whether to include availability info
      required: false
      schema:
        type: boolean
        default: false
    pageSize:
      name: page-size
      in: query
      description: Page size for get query
      required: false
      schema:
        type: integer
        format: int32
        default: 10
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
