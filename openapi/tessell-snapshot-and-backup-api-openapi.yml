openapi: 3.0.3
info:
  title: Tessell APIs activity-center Snapshot and Backup API
  contact:
    email: support@tessell.com
    name: Tessell Inc
    url: https://www.tessell.com
  description: Tessell API Documentation
  termsOfService: https://www.tessell.com/terms
  version: '1.0'
servers:
- url: '{server}'
  variables:
    server:
      default: console.tessell.com
tags:
- name: Snapshot and Backup
paths:
  /availability-machines/{availabilityMachineId}/snapshots:
    get:
      tags:
      - Snapshot and Backup
      summary: Get list of snapshots for an Availability Machine
      operationId: getDatabaseSnapshots
      x-terraform-resource: DBSnapshot
      x-terraform-operation: ReadList
      x-terraform:
        fieldInResponseForResourceList: Snapshots
        excludeParamsFromApiDefinition:
        - status
        - loadAcls
        - pageSize
        - pageOffset
        - timeZone
      parameters:
      - name: availabilityMachineId
        in: path
        description: ID of the Availability Machine
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: name
        in: query
        description: Filter the result based on snapshot name
        required: false
        style: form
        schema:
          type: string
          maxLength: 128
      - name: status
        in: query
        description: Filter the result based on snapshot status
        required: false
        style: form
        schema:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseBackupStatus'
      - name: automated
        in: query
        description: Filter the result based on if the snapshot is automated
        required: false
        style: form
        schema:
          type: boolean
          default: true
      - name: manual
        in: query
        description: Filter the result based on if the snapshot is manual
        required: false
        style: form
        schema:
          type: boolean
          default: true
      - name: sanitizable
        in: query
        description: Filter the result based on if the snapshot is sanitizable
        required: false
        style: form
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/loadAcls'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageOffset'
      - $ref: '#/components/parameters/timeZone'
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDatabaseSnapshotsResponse'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
      - Snapshot and Backup
      summary: Submit a request to capture the associated DB Service's snapshot
      operationId: createDatabaseSnapshotRequest
      x-terraform-resource: DBSnapshot
      x-terraform-operation: Create
      parameters:
      - name: availabilityMachineId
        in: path
        description: ID of the Availability Machine
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDatabaseSnapshotTaskPayload'
            examples:
              generic:
                $ref: '#/components/examples/CreateSnapshot'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/taskSummary'
              examples:
                generic:
                  $ref: '#/components/examples/CreateSnapshotSummary'
        '201':
          description: Created
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /availability-machines/{availabilityMachineId}/snapshots/{id}:
    get:
      tags:
      - Snapshot and Backup
      summary: Get details about the specified snapshot
      operationId: getDatabaseSnapshot
      x-terraform-resource: DBSnapshot
      x-terraform-operation: Read
      x-terraform:
        pollConfig:
          keyType: property
          property: Status
          pollBreakValue: AVAILABLE
          valueType: string
      parameters:
      - name: availabilityMachineId
        in: path
        description: ID of the Availability Machine
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        description: ID of the snapshot
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseSnapshot'
              examples:
                generic:
                  $ref: '#/components/examples/DBSnapshot'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags:
      - Snapshot and Backup
      summary: Submit a request to delete the snapshot
      operationId: deleteDatabaseSnapshotRequest
      x-terraform-resource: DBSnapshot
      x-terraform-operation: Delete
      parameters:
      - name: availabilityMachineId
        in: path
        description: ID of the Availability Machine
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        description: ID of the snapshot
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiStatus'
              examples:
                generic:
                  $ref: '#/components/examples/DeleteSnapshotSummary'
        '201':
          description: Created
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /availability-machines/{id}/backups/{backup-id}/download-url:
    post:
      tags:
      - Snapshot and Backup
      summary: Create download url for the backup
      operationId: createDownloadUrlRequest
      parameters:
      - name: id
        in: path
        description: Id of the Availability Machine
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: backup-id
        in: path
        description: ID of the backup
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpiryConfig'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/taskSummary'
        '204':
          description: No Content
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /availability-machines/{id}/restore-info:
    get:
      tags:
      - Snapshot and Backup
      summary: Get the restore or clone information for the specified snapshot or the recovery-timestamp
      operationId: getBackupRestoreInfo
      parameters:
      - name: id
        in: path
        description: ID of the Availability Machine
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: backup-id
        in: query
        description: ID of the snapshot
        required: false
        style: form
        schema:
          type: string
          format: uuid
      - name: recovery-timestamp
        in: query
        description: The recovery timestamp
        required: false
        style: form
        schema:
          type: string
      - $ref: '#/components/parameters/timeZone'
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbBackupRestoreInfo'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /availability-machines/{availabilityMachineId}/backups:
    get:
      tags:
      - Snapshot and Backup
      summary: View a list of available Tessell Backups
      operationId: getDatabaseBackups
      x-terraform-resource: DBBackup
      x-terraform-operation: ReadList
      x-terraform:
        fieldInResponseForResourceList: Backups
        excludeParamsFromApiDefinition:
        - loadAcls
        - pageSize
        - pageOffset
        - timeZone
        - status
      parameters:
      - name: availabilityMachineId
        in: path
        description: Id of the Availability Machine
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: name
        in: query
        description: Name of the backup
        required: false
        style: form
        schema:
          type: string
          maxLength: 128
      - name: status
        in: query
        description: status
        required: false
        style: form
        schema:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseBackupStatus'
      - name: automated
        in: query
        description: Specify if automated backups info is to be fetched
        required: false
        style: form
        schema:
          type: boolean
          default: true
      - name: manual
        in: query
        description: Specify if manual backups info is to be fetched
        required: false
        style: form
        schema:
          type: boolean
          default: true
      - $ref: '#/components/parameters/loadAcls'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageOffset'
      - $ref: '#/components/parameters/timeZone'
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDatabaseBackupsResponse'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
      - Snapshot and Backup
      summary: Create backup for the snapshot
      operationId: createBackupRequest
      parameters:
      - name: availabilityMachineId
        in: path
        description: Id of the Availability Machine
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBackupTaskPayload'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/taskSummary'
        '204':
          description: No Content
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /availability-machines/{availabilityMachineId}/backups/{id}:
    get:
      tags:
      - Snapshot and Backup
      summary: get backup
      operationId: getBackupRequest
      x-terraform-resource: DBBackup
      x-terraform-operation: Read
      parameters:
      - name: availabilityMachineId
        in: path
        description: Id of the Availability Machine
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        description: Id of the database backup
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseBackup'
        '204':
          description: No Content
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags:
      - Snapshot and Backup
      summary: Submit a request to delete the backup
      operationId: deleteBackupRequest
      parameters:
      - name: availabilityMachineId
        in: path
        description: ID of the Availability Machine
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        description: ID of the database backup
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiStatus'
        '204':
          description: No Content
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /availability-machines/{availabilityMachineId}/sanitized-snapshots:
    get:
      tags:
      - Snapshot and Backup
      summary: Get list of sanitized snapshots for an Availability Machine
      operationId: getSanitizedDatabaseSnapshots
      x-terraform-resource: SanitizedDBSnapshot
      x-terraform-operation: ReadList
      x-terraform:
        fieldInResponseForResourceList: Snapshots
        excludeParamsFromApiDefinition:
        - loadAcls
        - pageSize
        - pageOffset
        - timeZone
        - status
      parameters:
      - name: availabilityMachineId
        in: path
        description: ID of the Availability Machine
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: name
        in: query
        description: Filter the result based on Sanitized Snapshot name
        required: false
        style: form
        schema:
          type: string
      - name: status
        in: query
        description: Filter the result based on Sanitized Snapshot status
        required: false
        style: form
        schema:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseBackupStatus'
      - name: automated
        in: query
        description: Filter the result based on if the Sanitized Snapshot is automated
        required: false
        style: form
        schema:
          type: boolean
          default: true
      - name: manual
        in: query
        description: Filter the result based on if the Sanitized Snapshot is manual
        required: false
        style: form
        schema:
          type: boolean
          default: true
      - $ref: '#/components/parameters/loadAcls'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageOffset'
      - $ref: '#/components/parameters/timeZone'
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSanitizedDatabaseSnapshotsResponse'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
      - Snapshot and Backup
      summary: Submit a request to sanitize the specified snapshot
      operationId: createSanitizedDatabaseSnapshotRequest
      parameters:
      - name: availabilityMachineId
        in: path
        description: ID of the Availability Machine
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSanitizedDatabaseSnapshotTaskPayload'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/taskSummary'
        '201':
          description: Created
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /availability-machines/{availabilityMachineId}/sanitized-snapshots/{id}:
    get:
      tags:
      - Snapshot and Backup
      summary: Get details about the specified Sanitized Snapshot
      operationId: getSanitizedDatabaseSnapshot
      x-terraform-resource: SanitizedDBSnapshot
      x-terraform-operation: Read
      parameters:
      - name: availabilityMachineId
        in: path
        description: ID of the Availability Machine
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        description: ID of the Sanitized Snapshot
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanitizedDatabaseSnapshot'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags:
      - Snapshot and Backup
      summary: Submit a request to delete the Sanitized Snapshot
      operationId: deleteSanitizedDatabaseSnapshotRequest
      parameters:
      - name: availabilityMachineId
        in: path
        description: ID of the Availability Machine
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        description: ID of the Sanitized Snapshot
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiStatus'
        '201':
          description: Created
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    apiStatus:
      title: apiStatus
      type: object
      properties:
        status:
          type: string
        message:
          type: string
    ApiError:
      type: object
      description: Common error response object for non 2xx responses
      properties:
        code:
          type: string
          description: Status code for the error response
        message:
          type: string
          description: Error message for API response
        resolution:
          type: string
        timestamp:
          type: string
          format: date-time
        contextId:
          type: string
          description: ContextId of API request
        sessionId:
          type: string
          description: SessionId of API request
        tessellErrorCode:
          type: string
          description: Unique error code specific to Tessell
    commonYearlySchedule:
      allOf:
      - $ref: '#/components/schemas/DatesForEachMonth'
      - type: object
        properties:
          months:
            type: array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/Month'
              x-enum: true
    AzureNetAppCapacityPoolServiceLevel:
      type: string
      enum:
      - Standard
      - Premium
      - Ultra
      x-enum-varnames:
      - STANDARD
      - PREMIUM
      - ULTRA
    TessellServiceSqlServerEngineConfig:
      title: TessellServiceSqlServerEngineConfig
      type: object
      nullable: true
      properties:
        parameterProfileId:
          type: string
          format: uuid
          description: The parameter profile ID for the database
        adDomainId:
          type: string
          format: uuid
          description: Active Directory Domain ID
        serviceAccountUser:
          type: string
        agentServiceAccountUser:
          type: string
        instanceName:
          $ref: '#/components/schemas/SqlServerInstanceName'
    CloudRegionInfoWithEncryption:
      title: CloudRegionInfoWithEncryption
      description: Cloud and region details
      required:
      - cloud
      - regions
      properties:
        cloud:
          $ref: '#/components/schemas/cloudType'
          description: The cloud type
        regions:
          description: The regions details
          type: array
          items:
            $ref: '#/components/schemas/RegionInfoWithEncryption'
    WeekDay:
      description: Week Days
      type: string
      enum:
      - Sunday
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      x-enum-varnames:
      - Sunday
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
    BackupSource:
      description: Source from which the backup is derived
      type: string
      default: SNAPSHOT
      enum:
      - SNAPSHOT
      - DATABASE
    AwsInfraConfig:
      type: object
      title: AwsInfraConfig
      properties:
        awsCpuOptions:
          type: object
          title: AwsCpuOptions
          properties:
            vcpus:
              type: integer
              format: int32
              minimum: 0
              description: Number of vcpus for aws cpu options
    ScheduleInfo:
      type: object
      properties:
        backupStartTime:
          $ref: '#/components/schemas/TimeFormat'
        dailySchedule:
          $ref: '#/components/schemas/DailySchedule'
        weeklySchedule:
          $ref: '#/components/schemas/WeeklySchedule'
        monthlySchedule:
          $ref: '#/components/schemas/MonthlySchedule'
        yearlySchedule:
          $ref: '#/components/schemas/YearlySchedule'
    DatabaseBackupStatus:
      description: Database Backup Status
      type: string
      enum:
      - AVAILABLE
      - CREATING
      - FAILED
      - PREPARING
      - COPYING
    WeeklySchedule:
      type: object
      properties:
        days:
          description: Days in a week to retain weekly backups for
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/WeekDay'
            x-enum: true
    CreateBackupTaskPayload:
      title: CreateBackupTaskPayload
      type: object
      description: Payload to create a backup
      required:
      - name
      properties:
        backupSource:
          $ref: '#/components/schemas/BackupSource'
        snapshotId:
          format: uuid
          type: string
          nullable: true
          description: ID of the snapshot from which the backup is to be derived if backupSource is set to SNAPSHOT
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Name for the backup
        targetId:
          type: string
          format: uuid
          description: 'Optional: ID of the target entity for database-level backup (e.g., PDB ID). If not provided, backup is performed at service level.'
        targetType:
          $ref: '#/components/schemas/BackupTargetType'
    DatabaseSnapshotRegionInfo:
      title: RegionInfo
      description: Region availability details for a snapshot
      required:
      - region
      properties:
        region:
          type: string
          description: The region name
        status:
          description: The current status of the snapshot in the respective region
          type: string
          enum:
          - AVAILABLE
          - COPYING
          - NOT_AVAILABLE
    CreateSanitizedDatabaseSnapshotTaskPayload:
      title: CreateSanitizedDatabaseSnapshotTaskPayload
      type: object
      description: Payload to create a sanitized snapshot
      required:
      - name
      - snapshotId
      - scriptId
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Name for the sanitized snapshot, which is to be created
        description:
          type: string
          minLength: 0
          maxLength: 512
          nullable: true
          description: Description for the sanitized snapshot
        snapshotId:
          type: string
          format: uuid
          description: ID of the source snapshot (which is to be sanitized)
        scriptId:
          type: string
          format: uuid
          description: ID of the Sanitization Script, which is to be used for data sanitization
        scriptVersion:
          type: string
          minLength: 0
          maxLength: 128
          description: Version of the Sanitization Script
    ServiceAzureNetAppConfig:
      type: object
      properties:
        serviceLevel:
          $ref: '#/components/schemas/AzureNetAppCapacityPoolServiceLevel'
    DatabaseSnapshotCloudRegionInfo:
      title: CloudRegionInfo
      description: Cloud and region details
      required:
      - cloud
      properties:
        cloud:
          $ref: '#/components/schemas/cloudType'
          description: The cloud type
        regions:
          description: Region specific availability details for the snapshot
          type: array
          items:
            $ref: '#/components/schemas/DatabaseSnapshotRegionInfo'
    SubscriptionCloudAvailability:
      type: object
      properties:
        subscription:
          type: string
          description: The subscription name
        cloudAvailability:
          type: array
          items:
            $ref: '#/components/schemas/CloudRegionInfoWithEncryption'
    AzureNetAppNetworkFeature:
      description: Azure NetApp network feature configuration for creating volume
      type: string
      enum:
      - Standard
      - Basic
      x-enum-varnames:
      - STANDARD
      - BASIC
