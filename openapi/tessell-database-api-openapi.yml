          maxLength: 255
        description:
          type: string
          nullable: true
        dtype:
          $ref: '#/components/schemas/MilvusDatatype'
        isPrimary:
          type: boolean
          default: false
        autoId:
          type: boolean
          default: false
        defaultValue:
          type: string
