openapi: 3.0.3
info:
  title: Tessell APIs activity-center Ad Domain Governance API
  contact:
    email: support@tessell.com
    name: Tessell Inc
    url: https://www.tessell.com
  description: Tessell API Documentation
  termsOfService: https://www.tessell.com/terms
  version: '1.0'
servers:
- url: '{server}'
  variables:
    server:
      default: console.tessell.com
tags:
- name: Ad Domain Governance
paths:
  /ad-domains/governance:
    parameters:
    - $ref: '#/components/parameters/tenantIdMandatory'
    - $ref: '#/components/parameters/pageSize'
    - $ref: '#/components/parameters/pageOffset'
    get:
      tags:
      - Ad Domain Governance
      summary: Get List of Active Directory Domain
      operationId: getAdDomainsGovernance
      responses:
        '200':
          description: List of ad Domains
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdDomain'
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      parameters:
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
  /ad-domains/governance/register:
    post:
      tags:
      - Ad Domain Governance
      summary: Register an Active Directory Domain
      operationId: registerAdDomain
      parameters:
      - $ref: '#/components/parameters/tenantIdMandatory'
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAdDomainPayload'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdDomain'
        '201':
          description: Created
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /ad-domains/governance/id/{id}/reconfigure:
    patch:
      tags:
      - Ad Domain Governance
      summary: Reconfigure an Active Directory Domain
      operationId: reconfigureAdDomain
      parameters:
      - $ref: '#/components/parameters/tenantIdMandatory'
      - name: id
        in: path
        description: Ad Domain Identifier
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconfigureAdDomainPayload'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdDomain'
        '201':
          description: Created
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /ad-domains/governance/id/{id}/deregister:
    delete:
      tags:
      - Ad Domain Governance
      summary: Deregister an Active Directory Domain
      operationId: deregisterAdDomain
      parameters:
      - $ref: '#/components/parameters/tenantIdMandatory'
      - name: id
        in: path
        description: Ad Domain Identifier
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Authorization Token
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiStatus'
        '201':
          description: Created
        default:
          description: API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    apiStatus:
      title: apiStatus
      type: object
      properties:
        status:
          type: string
        message:
          type: string
    ApiError:
      type: object
      description: Common error response object for non 2xx responses
      properties:
        code:
          type: string
          description: Status code for the error response
        message:
          type: string
          description: Error message for API response
        resolution:
          type: string
        timestamp:
          type: string
          format: date-time
        contextId:
          type: string
          description: ContextId of API request
        sessionId:
          type: string
          description: SessionId of API request
        tessellErrorCode:
          type: string
          description: Unique error code specific to Tessell
    ReconfigureAdDomainPayload:
      description: Reconfigure Ad Domain Payload
      type: object
      properties:
        dnsServer:
          type: array
          items:
            type: string
        domainAccountUser:
          type: string
          description: Domain Account User
        domainAccountPassword:
          type: string
          description: Domain Account Password
    RegisterAdDomainPayload:
      description: Register Ad Domain Payload
      type: object
      properties:
        tessellName:
          type: string
          description: Tessell Name for Ad Domain
        domainName:
          type: string
          description: Domain Name
        netBIOSorOU:
          type: string
          description: NetBIOS name or OU for AD
        dnsServer:
          type: array
          items:
            type: string
        domainAccountUser:
          type: string
          description: Domain Account User
        domainAccountPassword:
          type: string
          description: Domain Account Password
    AdDomain:
      description: AD Domain Details
      type: object
      properties:
        id:
          type: string
          format: uuid
        tessellName:
          type: string
          description: Tessell Name for Ad Domain
        domainName:
          type: string
          description: Domain Name
        netBIOSorOU:
          type: string
          description: NetBIOS name or OU
        dnsServer:
          type: array
          items:
            type: string
        domainAccountUser:
          type: string
          description: Domain Account User
  parameters:
    pageSize:
      name: page-size
      in: query
      description: Page size for get query
      required: false
      schema:
        type: integer
        format: int32
        default: 10
    pageOffset:
      name: page-offset
      in: query
      description: Page offset for get query
      required: false
      schema:
        type: integer
        format: int32
        default: 0
    tenantIdMandatory:
      name: tenant-id
      in: header
      description: Id of the Tenant
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        example: 12345678-abcd-1234-abcd-1234abcd5678
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
