aid: tessell
name: Tessell
description: >-
  Tessell is a multi-cloud database-as-a-service (DBaaS) platform that runs Oracle, SQL Server, PostgreSQL, MySQL,
  MongoDB, Milvus, and Apache Kafka inside a customer's own AWS, Azure, or GCP account, under the customer's encryption
  keys and network policies. The platform is API-first — everything available in the Tessell console is also available
  through its REST API and Terraform provider — covering database provisioning, availability machines (backup/recovery),
  Dataflix data access, governance, security profiles, monitoring, and metering across engines and clouds.
